<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Revisión de Entregas — Docente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Estilos reutilizados -->
  <link rel="stylesheet" href="../Estudiante/entregas.css" />
</head>

<body class="bg-light text-dark">
  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3 border-bottom">
    <div class="d-flex align-items-center">
      <a href="/index.html" class="d-flex align-items-center text-decoration-none">
        <img
          src="../../Imagenes/Logo_ProgeSync.png"
          alt="Logo ProgeSync"
          style="height:40px; width:auto; margin-right:10px;"
        />
        <span style="font-size: 1.5rem; font-weight: bold;">
          <span style="color: black;">Proge</span><span style="color: orange;">Sync</span>
        </span>
      </a>
    </div>
  </nav>

  <!-- Contenido -->
  <main class="container py-4">
    <h1 class="h3 mb-4">Panel del Docente</h1>

    <div class="d-flex align-items-center gap-2 mb-3">
      <button class="btn btn-primary" id="btn-cargar">Cargar pendientes</button>
      <span id="msg" class="text-muted"></span>
    </div>

    <!-- Pendientes -->
    <div class="row" id="grid"></div>

    <!-- Aprobadas -->
    <h2 class="h5 mt-4">Entregas aprobadas</h2>
    <div class="row" id="grid-aprobadas"></div>
    
    <!-- Rechazadas -->
    <h2 class="h5 mt-4">Entregas rechazadas</h2>
    <div class="row" id="grid-rechazadas"></div>
  </main>

  <!-- Modal: Historial de la entrega (Docente) -->
  <div class="modal fade" id="modalHistorial" tabindex="-1" aria-labelledby="modalHistorialLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalHistorialLabel">Historial de la entrega</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-0">
          <!-- Loader -->
          <div id="historial-loader" class="p-4">
            <div class="d-flex align-items-center">
              <div class="spinner-border me-2" role="status" aria-hidden="true"></div>
              <strong>Cargando historial…</strong>
            </div>
          </div>

          <!-- Contenido -->
          <div id="historial-contenido" class="d-none">
            <ul id="historial-lista" class="list-group list-group-flush"></ul>
          </div>

          <!-- Vacío -->
          <div id="historial-vacio" class="p-4 d-none text-muted">Sin movimientos en el historial.</div>

          <!-- Error -->
          <div id="historial-error" class="p-4 d-none text-danger">Error al cargar el historial.</div>
        </div>
        <div class="modal-footer">
          <small class="text-muted">El historial es de solo lectura.</small>
        </div>
      </div>
    </div>
  </div>

  <!-- Guard de rol -->
  <script type="module">
    import { requireRole } from "/guard.js";
    window.SESION_PROMISE = requireRole(["docente", "admin"]);
  </script>

  <!-- Lógica -->
  <script>
    const API = "http://localhost:8000/api/entregas";
    (window.SESION_PROMISE || Promise.resolve(null))
      .then(s => { window.SESION = s; })
      .catch(() => {});
    const API_ORIGIN = new URL(API).origin;
    const esc = (s) => String(s ?? "");
    const mapEstado = (v) => {
      v = String(v || "").toLowerCase();
      if (v === "aprobado")  return "Aprobado";
      if (v === "rechazado") return "Rechazado";
      return "En revisión";
    };

    function setHistorialState(state /* 'loading'|'ok'|'empty'|'error' */) {
      const elLoader = document.getElementById("historial-loader");
      const elCont   = document.getElementById("historial-contenido");
      const elVacio  = document.getElementById("historial-vacio");
      const elError  = document.getElementById("historial-error");
      elLoader.classList.toggle("d-none", state !== "loading");
      elCont.classList.toggle("d-none", state !== "ok");
      elVacio.classList.toggle("d-none", state !== "empty");
      elError.classList.toggle("d-none", state !== "error");
    }

    function renderHistorial(items) {
      const esc = (s) => String(s ?? "");
      const ul = document.getElementById("historial-lista");
      ul.innerHTML = items.map((it) => {
        const fecha = it.fecha ? new Date(it.fecha).toLocaleString() : "";
        const usuario = it.usuario_nombre || `Usuario #${it.usuario_id ?? "—"}`;
        const esEstado = it.campo === "estado" || it.estado_anterior != null || it.estado_nuevo != null;

        const detalleEstado = esEstado ? `
          <div class="small text-muted">
            <strong>Estado:</strong>
            <span class="badge bg-light text-dark ms-1">${esc(it.estado_anterior ?? it.valor_anterior ?? "—")}</span>
            <span class="mx-1">→</span>
            <span class="badge bg-primary">${esc(it.estado_nuevo ?? it.valor_nuevo ?? "—")}</span>
          </div>` : "";

        const comentario = it.comentario ? `<div class="mt-1"><strong>Comentario:</strong> ${esc(it.comentario)}</div>` : "";

        return `
          <li class="list-group-item">
            <div class="d-flex justify-content-between">
              <div>
                <div class="fw-semibold">${esc(usuario)} <small class="text-muted">(${esc(it.usuario_rol ?? "")})</small></div>
                ${detalleEstado}
                ${comentario}
              </div>
              <div class="text-end">
                <div class="small text-muted">${fecha}</div>
              </div>
            </div>
          </li>
        `;
      }).join("");
    }

    async function abrirModalHistorial(entregaId, titulo) {
      document.getElementById("modalHistorialLabel").textContent =
        `Historial: ${titulo || `Entrega #${entregaId}`}`;

      setHistorialState("loading");
      document.getElementById("historial-lista").innerHTML = "";

      try {
        const res = await fetch(`${API}/${encodeURIComponent(entregaId)}/historial`, {
          credentials: "include"
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) setHistorialState("empty");
        else { renderHistorial(data); setHistorialState("ok"); }
      } catch (e) {
        console.error(e);
        setHistorialState("error");
      }

      const modalEl = document.getElementById("modalHistorial");
      new window.bootstrap.Modal(modalEl).show();
    }

    // ====== Delegación de clicks para el botón "Historial" en todas las tarjetas ======
    document.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".btn-historial");
      if (!btn) return;
      const id = btn.dataset.id;
      const titulo = btn.dataset.titulo || "";
      abrirModalHistorial(id, titulo);
    });

    async function cargarPendientes() {
      const grid = document.getElementById("grid");
      const msg = document.getElementById("msg");
      grid.innerHTML = "";
      msg.textContent = "Cargando…";
      try {
        const res = await fetch(`${API}/pendientes`, { credentials: "include" });
        if (!res.ok) throw new Error("No fue posible obtener pendientes");
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = `<div class="col-12"><p class="text-muted">No hay entregas pendientes</p></div>`;
          msg.textContent = "";
          return;
        }
        grid.innerHTML = data.map((e) => {
          const path = String(e.archivo || "");
          const normalized = path.startsWith("/") ? path : `/${path}`;
          const hrefArchivo = `${API_ORIGIN}${normalized}`;
          return `
            <div class="col-md-4">
              <div class="card mb-3">
                <div class="card-body">
                  <h5 class="card-title mb-2">${esc(e.titulo)}</h5>
                  <p class="text-muted mb-1">${esc(e.estudiante)} · ${esc(e.estudiante_email)}</p>
                  <p class="card-text small text-muted mb-1">
                    <em>Descripción:</em> ${esc(e.descripcion ?? "—")}
                  </p>
                  <p class="mb-3">
                    <a href="${hrefArchivo}" target="_blank" rel="noopener">Ver archivo</a>
                  </p>
                  <div class="d-flex gap-2">
                    <!-- ✅ Botón HISTORIAL (pendientes) -->
                    <button
                      class="btn btn-outline-secondary btn-sm btn-historial"
                      data-id="${e.id}"
                      data-titulo="${esc(e.titulo)}">
                      Historial
                    </button>
                    <button class="btn btn-success btn-sm" onclick="resolver(${e.id}, 'aprobado')">Aprobar</button>
                    <button class="btn btn-danger btn-sm" onclick="resolver(${e.id}, 'rechazado')">Rechazar</button>
                  </div>
                </div>
                <div class="card-footer bg-transparent border-0 pt-0">
                  <small class="text-muted">Enviado: ${e.fecha ? new Date(e.fecha).toLocaleString() : "—"}</small>
                </div>
              </div>
            </div>`;
        }).join("");
        msg.textContent = "";
      } catch (err) {
        grid.innerHTML = `<div class="col-12"><p class="text-danger">Error cargando pendientes</p></div>`;
        msg.textContent = "";
        console.error(err);
      }
    }

    async function cargarAprobadas() {
      const grid = document.getElementById("grid-aprobadas");
      try {
        const res = await fetch(`${API}/aprobadas`, { credentials: "include" });
        if (!res.ok) throw new Error("No fue posible obtener aprobadas");
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = `<div class="col-12"><p class="text-muted">No hay entregas en esta sección</p></div>`;
          return;
        }
        grid.innerHTML = data.map((e) => {
          const path = String(e.archivo || "");
          const normalized = path.startsWith("/") ? path : `/${path}`;
          const hrefArchivo = `${API_ORIGIN}${normalized}`;
          return `
            <div class="col-md-4">
              <div class="card mb-3 border-success">
                <div class="card-body">
                  <h6 class="card-title mb-1">${esc(e.titulo)}</h6>
                  <p class="text-muted mb-1">${esc(e.estudiante)} · ${esc(e.estudiante_email)}</p>
                  <p class="card-text small text-muted mb-1">
                    <em>Descripción:</em> ${esc(e.descripcion ?? "—")}
                  </p>
                  <p class="card-text small mb-1">
                    <a href="${hrefArchivo}" target="_blank" rel="noopener">Ver archivo</a>
                  </p>
                  <p class="card-text small text-success mb-2">
                    <strong>Comentario:</strong> ${esc(e.comentario_docente ?? "—")}
                  </p>
                  <div class="d-flex gap-2">
                    <!-- ✅ Botón HISTORIAL (aprobadas) -->
                    <button
                      class="btn btn-outline-secondary btn-sm btn-historial"
                      data-id="${e.id}"
                      data-titulo="${esc(e.titulo)}">
                      Historial
                    </button>
                  </div>
                  <small class="text-muted d-block mt-2">Enviado: ${e.fecha ? new Date(e.fecha).toLocaleString() : "—"}</small>
                </div>
              </div>
            </div>`;
        }).join("");
      } catch (e) {
        grid.innerHTML = `<div class="col-12"><p class="text-danger">Error cargando aprobadas</p></div>`;
      }
    }

    async function cargarRechazadas() {
      const grid = document.getElementById("grid-rechazadas");
      try {
        const res = await fetch(`${API}/rechazadas`, { credentials: "include" });
        if (!res.ok) throw new Error("No fue posible obtener rechazadas");
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = `<div class="col-12"><p class="text-muted">No hay entregas en esta sección</p></div>`;
          return;
        }
        grid.innerHTML = data.map((e) => {
          const path = String(e.archivo || "");
          const normalized = path.startsWith("/") ? path : `/${path}`;
          const hrefArchivo = `${API_ORIGIN}${normalized}`;
          return `
            <div class="col-md-4">
              <div class="card mb-3 border-danger">
                <div class="card-body">
                  <h6 class="card-title mb-1">${esc(e.titulo)}</h6>
                  <p class="text-muted mb-1">${esc(e.estudiante)} · ${esc(e.estudiante_email)}</p>
                  <p class="card-text small text-muted mb-1">
                    <em>Descripción:</em> ${esc(e.descripcion ?? "—")}
                  </p>
                  <p class="card-text small mb-1">
                    <a href="${hrefArchivo}" target="_blank" rel="noopener">Ver archivo</a>
                  </p>
                  <p class="card-text small text-danger mb-2">
                    <strong>Comentario:</strong> ${esc(e.comentario_docente ?? "—")}
                  </p>
                  <div class="d-flex gap-2">
                    <!-- ✅ Botón HISTORIAL (rechazadas) -->
                    <button
                      class="btn btn-outline-secondary btn-sm btn-historial"
                      data-id="${e.id}"
                      data-titulo="${esc(e.titulo)}">
                      Historial
                    </button>
                  </div>
                  <small class="text-muted d-block mt-2">Enviado: ${e.fecha ? new Date(e.fecha).toLocaleString() : "—"}</small>
                </div>
              </div>
            </div>`;
        }).join("");
      } catch (e) {
        grid.innerHTML = `<div class="col-12"><p class="text-danger">Error cargando rechazadas</p></div>`;
      }
    }

    async function resolver(id, estado) {
      const comentario = prompt(`Comentario (${estado}):`) || "";
      const msg = document.getElementById("msg");
      msg.textContent = "Enviando revisión…";
      try {
        const res = await fetch(`${API}/${id}/estado`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ estado: mapEstado(estado), comentario }),
        });
        if (!res.ok) throw new Error("No se pudo registrar la revisión");
        msg.textContent = "Revisión registrada";
        await Promise.all([cargarPendientes(), cargarAprobadas(), cargarRechazadas()]);
      } catch (err) {
        msg.textContent = "Error al registrar la revisión";
        console.error(err);
      } finally {
        setTimeout(() => (msg.textContent = ""), 1500);
      }
    }
    window.resolver = resolver;

    document.getElementById("btn-cargar").addEventListener("click", cargarPendientes);
    cargarPendientes();
    cargarAprobadas();
    cargarRechazadas();
  </script>

  <!-- Bootstrap bundle (modal y utilidades) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

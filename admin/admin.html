<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Gestión de Usuarios — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons (opcional) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>
<body class="bg-light text-dark">

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3 border-bottom">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-3">
        <a class="navbar-brand fw-semibold" href="/">ProgreSync</a>
        <ul class="navbar-nav flex-row gap-3" id="nav-items"></ul>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="whoami" class="small text-muted"></span>
        <a class="btn btn-outline-secondary btn-sm" href="/iniciosesion/iniciosesion.html">Salir</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 m-0">Usuarios</h1>
      <button id="btnNuevo" class="btn btn-primary">
        <i class="bi bi-person-plus"></i> Nuevo usuario
      </button>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <input id="buscar" class="form-control" placeholder="Buscar por nombre o email">
          <button id="btnBuscar" class="btn btn-outline-secondary">Buscar</button>
        </div>
      </div>
      <div class="col-12 col-md-3">
        <select id="filtroEstado" class="form-select">
          <option value="">Todos</option>
          <option value="activo">Activos</option>
          <option value="inactivo">Inactivos</option>
        </select>
      </div>
    </div>

    <div id="msg"></div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="grid"></tbody>
      </table>
    </div>

    <!-- ====== Auditoría (RF-10) ====== -->
    <section class="my-4" id="sec-auditoria">
      <div class="card shadow-sm">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h5 class="mb-0">Auditoría (bitácora)</h5>
          <small class="text-muted">RF-10</small>
        </div>

        <div class="card-body">
          <!-- Filtros -->
          <form id="audFiltros" class="row g-2 align-items-end mb-3">
            <div class="col-sm-4">
              <label class="form-label">Buscar</label>
              <input name="q" class="form-control" placeholder="usuario, ruta, acción, entidad">
            </div>
            <div class="col-sm-2">
              <label class="form-label">Acción</label>
              <select name="action" class="form-select">
                <option value="">Todas</option>
                <option>CREATE</option><option>UPDATE</option><option>DELETE</option>
                <option>LOGIN</option><option>LOGOUT</option><option>READ</option>
              </select>
            </div>
            <div class="col-sm-2">
              <label class="form-label">Entidad</label>
              <input name="entity" class="form-control" placeholder="usuarios, entregas, auth...">
            </div>
            <div class="col-sm-2">
              <label class="form-label">Desde</label>
              <input type="date" name="from" class="form-control">
            </div>
            <div class="col-sm-2">
              <label class="form-label">Hasta</label>
              <input type="date" name="to" class="form-control">
            </div>
            <div class="col-auto">
              <button class="btn btn-dark">Filtrar</button>
            </div>
          </form>

          <div id="audMsg" class="small text-muted mb-2">—</div>

          <!-- Tabla -->
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Fecha</th>
                  <th>Usuario</th>
                  <th>Acción</th>
                  <th>Entidad</th>
                  <th>Método</th>
                  <th class="w-50">Ruta</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="audGrid"></tbody>
            </table>
          </div>

          <!-- Paginación -->
          <div class="d-flex gap-2 justify-content-end">
            <button class="btn btn-outline-secondary btn-sm" id="audPrev">‹ Anterior</button>
            <button class="btn btn-outline-secondary btn-sm" id="audNext">Siguiente ›</button>
          </div>
        </div>
      </div>
    </section>
    <!-- ====== Fin Auditoría ====== -->
  </main>

  <!-- Modal Usuario (Nuevo / Editar) -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formUsuario">
          <div class="modal-header">
            <h5 class="modal-title">Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="uId" />
            <div class="mb-2">
              <label class="form-label">Nombre</label>
              <input id="uNombre" class="form-control" required />
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input id="uEmail" type="email" class="form-control" required />
            </div>
            <div class="mb-2">
              <label class="form-label">Rol</label>
              <select id="uRol" class="form-select">
                <option value="admin">admin</option>
                <option value="docente">docente</option>
                <option value="estudiante">estudiante</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Estado</label>
              <select id="uEstado" class="form-select">
                <option value="activo">activo</option>
                <option value="inactivo">inactivo</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Contraseña (dejar vacío para no cambiar)</label>
              <input id="uPass" type="password" class="form-control" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ÚNICO módulo de la página: guard, whoami, menú y Auditoría -->
  <script type="module">
    import { ensureAdmin, API_BASE } from "/guard.js";

    // 1) Guard una sola vez
    const ok = await ensureAdmin();
    if (!ok) throw new Error("No admin");

    // 2) Sesión una sola vez
    const SESSION = await window.SESION_PROMISE;

    // 3) Whoami + menú
    const whoami = document.getElementById("whoami");
    if (whoami && SESSION?.email && SESSION?.rol) {
      whoami.textContent = `${SESSION.email} · ${SESSION.rol}`;
    }
    const ul = document.getElementById("nav-items");
    if (ul && SESSION?.rol === "admin") {
      const old = ul.querySelector('[data-nav="admin-usuarios"]');
      if (old) old.remove();
      const li = document.createElement("li");
      li.className = "nav-item";
      li.setAttribute("data-nav", "admin-usuarios");
      li.innerHTML = `<a class="nav-link" href="/admin/admin.html">
                        <i class="bi bi-people"></i> Usuarios
                      </a>`;
      ul.appendChild(li);
    }

    // 4) Auditoría
  const API = `${API_BASE}/auditoria`;
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const badge = (a) => a==="CREATE"?"success":a==="UPDATE"?"warning":a==="DELETE"?"danger":a==="LOGIN"?"primary":a==="LOGOUT"?"secondary":"dark";

    const f = document.getElementById("audFiltros");
    const msg = document.getElementById("audMsg");
    const grid = document.getElementById("audGrid");
    const btnPrev = document.getElementById("audPrev");
    const btnNext = document.getElementById("audNext");

    let state = { page: 1, limit: 50, q:"", action:"", entity:"", from:"", to:"", sort:"created_at", dir:"DESC", pages: 1 };

    async function fetchAudit(params) {
      const qs = new URLSearchParams(params);
      const r = await fetch(`${API}?${qs.toString()}`, { credentials: "include" });
      if (!r.ok) throw new Error("No se pudo cargar auditoría");
      return r.json();
    }

    function row(a) {
      return `
        <tr>
          <td class="text-nowrap">${esc(a.created_at)}</td>
          <td>${esc(a.user_email ?? a.user_id ?? "—")}</td>
          <td><span class="badge text-bg-${badge(a.action)}">${esc(a.action)}</span></td>
          <td>${esc(a.entity)}${a.entity_id ? ` #${esc(a.entity_id)}` : ""}</td>
          <td>${esc(a.method ?? "—")}</td>
          <td class="text-truncate" title="${esc(a.path)}">${esc(a.path ?? "—")}</td>
          <td>${a.status_code ?? "—"}</td>
        </tr>
      `;
    }

    async function render() {
      msg.textContent = "Cargando…";
      try {
        const res = await fetchAudit(state);
        grid.innerHTML = res.data.map(row).join("") || `<tr><td colspan="7" class="text-center">Sin registros</td></tr>`;
        state.pages = res.pages ?? 1;
        msg.textContent = `Mostrando ${res.data.length} de ${res.total} registros (pág. ${res.page}/${res.pages})`;
        btnPrev.disabled = state.page <= 1;
        btnNext.disabled = state.page >= state.pages;
      } catch (e) {
        console.error(e);
        msg.textContent = "Error cargando la bitácora";
        grid.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error al cargar</td></tr>`;
      }
    }

    f.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const data = Object.fromEntries(new FormData(f).entries());
      state = { ...state, page: 1, ...data };
      render();
    });

    btnPrev.addEventListener("click", () => { if (state.page > 1) { state.page--; render(); } });
    btnNext.addEventListener("click", () => { if (state.page < state.pages) { state.page++; render(); } });

    // Primera carga
    render();
  </script>

  <!-- Lógica propia de gestión de usuarios -->
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>

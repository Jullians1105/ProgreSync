<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mis Entregas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./entregas.css" />
</head>
<body class="bg-light text-dark">
  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3 border-bottom">
    <div class="d-flex align-items-center">
      <!-- LOGO + Marca: todo el bloque es clickeable y lleva al inicio -->
      <a href="/index.html" class="d-flex align-items-center text-decoration-none">
        <img
          src="../../Imagenes/Logo_ProgeSync.png"
          alt="Logo ProgeSync"
          style="height:40px; width:auto; margin-right:10px;"
        />
        <span style="font-size:1.5rem; font-weight:bold;">
          <span style="color:black;">Proge</span><span style="color:orange;">Sync</span>
        </span>
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-4">Mis Entregas — Estudiante</h1>

    <form id="form-entrega" class="my-3">
      <input id="titulo" class="form-control mb-2" placeholder="Título" required />
      <textarea id="descripcion" class="form-control mb-2" placeholder="Descripción"></textarea>
      <input id="archivo" type="file" class="form-control mb-2" accept=".pdf,.doc,.docx" required />
      <button type="submit" class="btn btn-primary">Enviar</button>
      <span id="msg" class="ms-2"></span>
    </form>

    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Título</th>
          <th>Descripción</th>
          <th>Archivo</th>
          <th>Estado</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tbody-entregas"></tbody>
    </table>
  </main>

  <!-- Guard de rol: valida sesión ANTES de la lógica de la vista -->
  <script type="module">
    import { requireRole } from "/guard.js";
    // guard.js expone window.SESION_PROMISE
    window.SESION_PROMISE = requireRole(["estudiante"]);
  </script>

  <!-- Lógica de esta vista (como módulo para poder usar imports/await) -->
  <script type="module" src="./entregas.js"></script>
</body>
</html>

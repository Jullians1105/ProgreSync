<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Gestión de Usuarios — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons (opcional) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>
<body class="bg-light text-dark">

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3 border-bottom">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-3">
        <a class="navbar-brand fw-semibold" href="/">ProgreSync</a>
        <ul class="navbar-nav flex-row gap-3" id="nav-items">
          <!-- Ejemplos de enlaces comunes -->
          <!-- Aquí se inyectará “Usuarios” solo si SESSION.rol === 'admin' -->
        </ul>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="whoami" class="small text-muted"></span>
        <a class="btn btn-outline-secondary btn-sm" href="/logout">Salir</a>
      </div>
    </div>
  </nav>

  <!-- Script Opción A: inyectar enlace “Usuarios” si es admin -->
  <script type="module">
  import { ensureAdmin } from "/guard.js";
  const ok = await ensureAdmin();
  if (!ok) {
    // el guard ya redirige; detenemos cualquier inicialización
    throw new Error("No admin");
  }
    import { API_BASE } from "/guard.js";
    const SESSION = await window.SESION_PROMISE;
    const ul = document.getElementById("nav-items");

    // Mostrar quién soy (opcional)
    const whoami = document.getElementById("whoami");
    if (whoami && SESSION?.email && SESSION?.rol) {
      whoami.textContent = `${SESSION.email} · ${SESSION.rol}`;
    }

    if (ul) {
      // Evita duplicado si recargas SPA o navegas internamente
      const old = ul.querySelector('[data-nav="admin-usuarios"]');
      if (old) old.remove();

      if (SESSION && SESSION.rol === "admin") {
        const li = document.createElement("li");
        li.className = "nav-item";
        li.setAttribute("data-nav", "admin-usuarios");
        li.innerHTML = `<a class="nav-link" href="/admin/admin.html">
                          <i class="bi bi-people"></i> Usuarios
                        </a>`;
        ul.appendChild(li);
      }
    }
  </script>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 m-0">Usuarios</h1>
      <button id="btnNuevo" class="btn btn-primary">
        <i class="bi bi-person-plus"></i> Nuevo usuario
      </button>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <input id="buscar" class="form-control" placeholder="Buscar por nombre o email">
          <button id="btnBuscar" class="btn btn-outline-secondary">Buscar</button>
        </div>
      </div>
      <div class="col-12 col-md-3">
        <select id="filtroEstado" class="form-select">
          <option value="">Todos</option>
          <option value="activo">Activos</option>
          <option value="inactivo">Inactivos</option>
        </select>
      </div>
    </div>

    <div id="msg"></div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="grid"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal Crear/Editar -->
  <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formUsuario">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Nuevo usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="uid">

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input id="nombre" class="form-control" required minlength="2" maxlength="120">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" type="email" class="form-control" required maxlength="160">
          </div>

          <div class="mb-3">
            <label class="form-label">Rol</label>
            <select id="rol" class="form-select" required>
              <option value="docente">Docente</option>
              <option value="estudiante">Estudiante</option>
              <option value="admin">Admin</option>
              <option value="empresa">Empresa</option>
            </select>
          </div>

          <div class="mb-3" id="grpPass">
            <label class="form-label">Contraseña (mínimo 8)</label>
            <input id="password" type="password" class="form-control" minlength="8">
            <div class="form-text">Solo se solicita al crear.</div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancelar</button>
          <button class="btn btn-primary" id="btnGuardar" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica de la página -->
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>

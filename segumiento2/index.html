<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProgreSync – Seguimiento</title>
<link rel="stylesheet" href="se.css">
</head>
<body>
<!-- NAVBAR -->
<header class="navbar">
<div class="nav-inner">
<div class="brand">
<img src="logo.png" alt="ProgreSync logo" />
<strong>Progre<span class="accent">Sync</span></strong>
</div>
<nav class="nav-links" aria-label="Secciones">
<a class="nav-link" href="#">Inicio</a>
<a class="nav-link" href="#">Entregas</a>
<a class="nav-link active" href="#">Seguimiento</a>
<a class="nav-link" href="#">Notificaciones</a>
<a class="nav-link" href="#">Ayuda</a>
</nav>
</div>
</header>


<div class="wrap">
<!-- INFORMACIÓN PERSONAL -->
<section class="card" aria-labelledby="t-personal">
<div class="card-hd" id="t-personal">Información Personal</div>
<div class="card-bd">
<div class="grid grid-2">
<div class="field">
<label class="label" for="nombres">Nombres</label>
<input class="input" id="nombres" type="text" />
</div>
<div class="field">
<label class="label" for="apellidos">Apellidos</label>
<input class="input" id="apellidos" type="text" />
</div>
<div class="field">
<label class="label" for="programa">Programa</label>
<input class="input" id="programa" type="text" />
</div>
<div class="field">
<label class="label" for="semestre">Semestre de ingreso</label>
<input class="input" id="semestre" type="text" />
</div>
<div class="field">
<label class="label" for="modalidad">Modalidad</label>
<input class="input" id="modalidad" type="text" />
</div>
</div>
</div>
</section>

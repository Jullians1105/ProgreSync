  <!-- Lógica específica del panel del docente -->
  <script>
    // API base (ajústala si cambiaste el puerto o ruta en tu backend)
    const API = "http://localhost:8000/api/entregas";

    // Añadimos esta constante para obtener solo el ORIGEN del backend (http://localhost:8000)
    // y así construir enlaces absolutos para los archivos
    const API_ORIGIN = new URL(API).origin;

    const ID_DOCENTE = window.SESION?.id;

    const esc = (s) => String(s ?? "");

    // Cargo entregas pendientes para revisión
    async function cargarPendientes() {
      const grid = document.getElementById("grid");
      const msg = document.getElementById("msg");
      grid.innerHTML = "";
      msg.textContent = "Cargando…";

      try {
        const res = await fetch(`${API}/pendientes`);
        if (!res.ok) throw new Error("No fue posible obtener pendientes");
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = `<div class="col-12"><p class="text-muted">No hay entregas pendientes</p></div>`;
          msg.textContent = "";
          return;
        }

        grid.innerHTML = data
          .map((e) => {
            // Añadimos normalización para el path de archivo y forzamos a apuntar al backend
            const path = String(e.archivo || "");
            const normalized = path.startsWith("/") ? path : `/${path}`;
            const hrefArchivo = `${API_ORIGIN}${normalized}`;

            return `
          <div class="col-md-4">
            <div class="card mb-3">
              <div class="card-body">
                <h5 class="card-title mb-2">${esc(e.titulo)}</h5>
                <p class="card-text small text-muted mb-2">${esc(e.descripcion)}</p>
                <p class="mb-3">
                  <!-- Añadimos el uso de hrefArchivo para que abra desde backend -->
                  <a href="${hrefArchivo}" target="_blank">Ver archivo</a>
                </p>
                <div class="d-flex gap-2">
                  <button class="btn btn-success btn-sm" onclick="resolver(${e.id}, 'aprobado')">Aprobar</button>
                  <button class="btn btn-danger btn-sm" onclick="resolver(${e.id}, 'rechazado')">Rechazar</button>
                </div>
              </div>
              <div class="card-footer bg-transparent border-0 pt-0">
                <small class="text-muted">Enviado: ${new Date(e.fecha).toLocaleString()}</small>
              </div>
            </div>
          </div>`;
          })
          .join("");

        msg.textContent = "";
      } catch (err) {
        grid.innerHTML = `<div class="col-12"><p class="text-danger">Error cargando pendientes</p></div>`;
        msg.textContent = "";
        console.error(err);
      }
    }

    // Aprobar o rechazar una entrega
    async function resolver(id, estado) {
      const comentario = prompt(`Comentario (${estado}):`) || "";
      const msg = document.getElementById("msg");
      msg.textContent = "Enviando revisión…";

      try {
        const res = await fetch(`${API}/${id}/revision`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id_docente: ID_DOCENTE,
            nuevo_estado: estado,
            comentario,
          }),
        });

        if (!res.ok) throw new Error("No se pudo registrar la revisión");
        msg.textContent = "Revisión registrada";
        cargarPendientes();
      } catch (err) {
        msg.textContent = "Error al registrar la revisión";
        console.error(err);
      } finally {
        setTimeout(() => (msg.textContent = ""), 1500);
      }
    }

    // Exponer resolver al ámbito global para usarlo desde los botones inline
    window.resolver = resolver;

    // Botón para cargar pendientes
    document
      .getElementById("btn-cargar")
      .addEventListener("click", cargarPendientes);

    // Carga inicial
    cargarPendientes();
  </script>

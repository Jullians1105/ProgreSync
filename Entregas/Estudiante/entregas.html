<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mis Entregas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap para estilos rápidos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./entregas.css">
</head>
<body class="bg-light text-dark">
  <!-- 🔹 Navbar superior con fondo blanco -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3 border-bottom">
    <div class="d-flex align-items-center">
      <!-- Logo: ajusta la ruta según la ubicación -->
      <img src="../../Imagenes/Logo_ProgeSync.png" alt="Logo ProgeSync" 
           style="height:40px; width:auto; margin-right:10px;">
      <!-- Texto ProgeSync -->
      <span style="font-size:1.5rem; font-weight:bold;">
        <span style="color:black;">Proge</span><span style="color:orange;">Sync</span>
      </span>
    </div>
  </nav>
  <!-- 🔹 Fin navbar -->

  <!-- Contenido principal -->
  <main class="container py-4">
    <h1 class="h3 mb-4">Mis Entregas — Estudiante</h1>

    <!-- Formulario para subir archivo -->
    <!-- Aquí el estudiante coloca título, descripción y selecciona un archivo -->
    <form id="form-entrega" class="my-3">
      <input id="titulo" class="form-control mb-2" placeholder="Título" required>
      <textarea id="descripcion" class="form-control mb-2" placeholder="Descripción"></textarea>
      <input id="archivo" type="file" class="form-control mb-2" accept=".pdf,.doc,.docx" required>
      <button type="submit" class="btn btn-primary">Enviar</button>
      <span id="msg" class="ms-2"></span>
    </form>

    <!-- Tabla donde se listan las entregas del estudiante -->
    <!-- Cada fila se llenará dinámicamente con JS -->
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Título</th>
          <th>Descripción</th>
          <th>Archivo</th>
          <th>Estado</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tbody-entregas">
        <!-- Aquí JS insertará las entregas -->
      </tbody>
    </table>
  </main>

  <!-- 🔹 Validación de rol: solo estudiantes pueden entrar -->
  <script type="module">
    import { requireRole } from "../guard.js";
    window.SESION = requireRole(['estudiante']);
  </script>

  <!-- 🔹 Lógica de esta vista -->
  <script src="./entregas.js"></script>
</body>
</html>

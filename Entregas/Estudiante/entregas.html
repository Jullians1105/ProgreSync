<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mis Entregas — Estudiante</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./entregas.css" />
</head>
<body class="bg-light text-dark">
  <nav class="navbar navbar-light bg-white shadow-sm px-3 border-bottom">
    <div class="d-flex align-items-center">
      <a href="/index.html" class="d-flex align-items-center text-decoration-none">
        <img src="../../Imagenes/Logo_ProgeSync.png" alt="Logo ProgeSync"
             style="height:40px;width:auto;margin-right:10px;" />
        <span style="font-size:1.5rem;font-weight:bold;">
          <span style="color:black;">Proge</span><span style="color:orange;">Sync</span>
        </span>
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-4">Mis Entregas — Estudiante</h1>

    <!-- Añadí name a los inputs para que el backend reciba titulo, descripcion y archivo -->
    <form id="form-entrega" class="my-3">
      <input id="titulo" name="titulo" class="form-control mb-2" placeholder="Título" required />
      <textarea id="descripcion" name="descripcion" class="form-control mb-2" placeholder="Descripción"></textarea>
      <input id="archivo" name="archivo" type="file" class="form-control mb-2"
             accept=".pdf,.doc,.docx" required />
      <button type="submit" class="btn btn-primary">Enviar</button>
      <span id="msg" class="ms-2"></span>
    </form>

    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <!-- Alineo el orden de columnas con el tbody que pinto desde entregas.js -->
          <th>Título</th>
          <th>Descripción</th>
          <th>Archivo</th>
          <th>Estado</th>
          <th>Comentario</th> <!-- Añadí esta columna para mostrar el comentario del docente -->
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tbody-entregas"></tbody>
    </table>
  </main>

  <!-- Guard de rol -->
  <script type="module">
    import { requireRole } from "/guard.js";
    window.SESION_PROMISE = requireRole(["estudiante"]);
  </script>

  <!-- Lógica -->
  <script type="module" src="./entregas.js"></script>
</body>
</html>

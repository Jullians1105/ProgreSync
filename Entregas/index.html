<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entregas</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:24px}
  </style>
</head>
<body>
  <p>Redirigiendo a tu sección de Entregas…</p>
  <script>
    // Backend
    const API_BASE = "http://localhost:8000";

    (async () => {
      try {
        const r = await fetch(`${API_BASE}/me`, { credentials: "include" });
        if (!r.ok) {
          // sin sesión → login (ruta absoluta desde la raíz del sitio)
          location.href = "/iniciosesion/iniciosesion.html";
          return;
        }
        const me = await r.json();
        const rol = (me && me.user && (me.user.rol || me.user.role)) || null;

        if (rol === "docente" || rol === "admin") {
          // desde /Entregas/ uso rutas relativas a esta carpeta
          location.href = "Docente/docente.html";
        } else if (rol === "estudiante") {
          location.href = "Estudiante/entregas.html";
        } else {
          location.href = "/index.html";
        }
      } catch (e) {
        console.error(e);
        location.href = "/index.html";
      }
    })();
  </script>
</body>
</html>

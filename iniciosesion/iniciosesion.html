<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>ProgeSync | Iniciar sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <main>
    <h1>Iniciar sesión</h1>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required value="admin@correo.com" />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required />

      <!-- ¡Importante!: submit -->
      <button id="loginBtn" type="submit">Iniciar sesión</button>
    </form>

    <pre id="out" style="background:#111;color:#0f0;padding:12px;border-radius:8px;"></pre>
  </main>

  <!-- Carga el script al final del body -->
  <script type="module" src="./login.js"></script>
</body>
</html>

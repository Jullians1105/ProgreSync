<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Revisión de Entregas — Docente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap para estilos rápidos -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Reutilizo estilos de estados desde la vista de estudiante -->
  <link rel="stylesheet" href="../Estudiante/entregas.css" />
</head>

<!-- Fondo claro para mantener coherencia con index -->
<body class="bg-light text-dark">

  <!-- ───────────────────────── Navbar ───────────────────────── -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3 border-bottom">
    <div class="d-flex align-items-center">
      <!-- LOGO + Marca: todo el bloque es clickeable y lleva al inicio -->
      <a href="/index.html" class="d-flex align-items-center text-decoration-none">
        <img
          src="../../Imagenes/Logo_ProgeSync.png"
          alt="Logo ProgeSync"
          style="height:40px; width:auto; margin-right:10px;"
        />
        <span style="font-size: 1.5rem; font-weight: bold;">
          <span style="color: black;">Proge</span><span style="color: orange;">Sync</span>
        </span>
      </a>
    </div>
  </nav>
  <!-- ─────────────────────── Fin Navbar ─────────────────────── -->

  <!-- Contenido principal -->
  <main class="container py-4">
    <h1 class="h3 mb-4">Panel del Docente</h1>

    <!-- Acciones del docente -->
    <div class="d-flex align-items-center gap-2 mb-3">
      <button class="btn btn-primary" id="btn-cargar">Cargar pendientes</button>
      <span id="msg" class="text-muted"></span>
    </div>

    <!-- Grid de tarjetas con entregas pendientes -->
    <div class="row" id="grid">
      <!-- JS inyecta aquí las tarjetas de entregas por revisar -->
    </div>
  </main>

  <!-- Guard de rol: SOLO docentes/admin pueden entrar a esta vista -->
  <script type="module">
    import { requireRole } from "/guard.js";
    window.SESION_PROMISE = requireRole(["docente", "admin"]); // guarda sesión en window.SESION_PROMISE
  </script>

  <!-- Lógica específica del panel del docente -->
  <script>
    // API base (ajústala si cambiaste el puerto o ruta en tu backend)
    const API = "http://localhost:8000/api/entregas";

    // Añadimos esta asignación para tener mi sesión disponible en este script no-module
    (window.SESION_PROMISE || Promise.resolve(null))
      .then(s => { window.SESION = s; })
      .catch(() => {});


    // Añadimos API_ORIGIN para quedarme solo con el origen del backend (http://localhost:8000)
    // y así construir enlaces absolutos a los PDFs.
    const API_ORIGIN = new URL(API).origin;

    const ID_DOCENTE = window.SESION?.id;

    const esc = (s) => String(s ?? "");

    // Añadimos este mapeo para enviar el estado con la convención que espera el backend
    const mapEstado = (v) => {
      v = String(v || "").toLowerCase();
      if (v === "aprobado")  return "Aprobado";
      if (v === "rechazado") return "Rechazado";
      return "En revisión";
    };


    // Cargo entregas pendientes para revisión
    async function cargarPendientes() {
      const grid = document.getElementById("grid");
      const msg = document.getElementById("msg");
      grid.innerHTML = "";
      msg.textContent = "Cargando…";

      try {
        const res = await fetch(`${API}/pendientes`);
        if (!res.ok) throw new Error("No fue posible obtener pendientes");
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = `<div class="col-12"><p class="text-muted">No hay entregas pendientes</p></div>`;
          msg.textContent = "";
          return;
        }

        grid.innerHTML = data
          .map(
            (e) => {
              // Añadimos normalización del path y forzamos a apuntar al backend
              const path = String(e.archivo || "");
              const normalized = path.startsWith("/") ? path : `/${path}`;
              const hrefArchivo = `${API_ORIGIN}${normalized}`;

              return `
          <div class="col-md-4">
            <div class="card mb-3">
              <div class="card-body">
                <h5 class="card-title mb-2">${esc(e.titulo)}</h5>
                <p class="card-text small text-muted mb-2">${esc(e.descripcion)}</p>
                <p class="mb-3">
                  <!-- Añadimos el uso de API_ORIGIN para que abra desde backend -->
                  <a href="${hrefArchivo}" target="_blank" rel="noopener">Ver archivo</a>
                </p>
                <div class="d-flex gap-2">
                  <button class="btn btn-success btn-sm" onclick="resolver(${e.id}, 'aprobado')">Aprobar</button>
                  <button class="btn btn-danger btn-sm" onclick="resolver(${e.id}, 'rechazado')">Rechazar</button>
                </div>
              </div>
              <div class="card-footer bg-transparent border-0 pt-0">
                <small class="text-muted">Enviado: ${new Date(e.fecha).toLocaleString()}</small>
              </div>
            </div>
          </div>`;
            }
          )
          .join("");

        msg.textContent = "";
      } catch (err) {
        grid.innerHTML = `<div class="col-12"><p class="text-danger">Error cargando pendientes</p></div>`;
        msg.textContent = "";
        console.error(err);
      }
    }

    // Aprobar o rechazar una entrega
    async function resolver(id, estado) {
      const comentario = prompt(`Comentario (${estado}):`) || "";
      const msg = document.getElementById("msg");
      msg.textContent = "Enviando revisión…";

      try {
        const res = await fetch(`${API}/${id}/estado`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          credentials: "include", // Añadimos credentials para enviar la cookie de sesión
          body: JSON.stringify({
            estado: mapEstado(estado), // Añadimos el estado con la convención del backend
            comentario,
          }),
        });


        if (!res.ok) throw new Error("No se pudo registrar la revisión");
        msg.textContent = "Revisión registrada";
        cargarPendientes();
      } catch (err) {
        msg.textContent = "Error al registrar la revisión";
        console.error(err);
      } finally {
        setTimeout(() => (msg.textContent = ""), 1500);
      }
    }

    // Exponer resolver al ámbito global para usarlo desde los botones inline
    window.resolver = resolver;

    // Botón para cargar pendientes
    document
      .getElementById("btn-cargar")
      .addEventListener("click", cargarPendientes);

    // Carga inicial
    cargarPendientes();
  </script>
</body>
</html>
